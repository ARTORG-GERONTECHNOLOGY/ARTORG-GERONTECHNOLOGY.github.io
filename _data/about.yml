title: About
overview: This website shares student research and thesis proposals from the Gerontechnology and Rehabilitation Group at the ARTORG Center, University of Bern.
group_text: The group develops and evaluates assistive and rehabilitative technologies to support independent living and quality of life.
program_text: The master's program in Biomedical Engineering (BME) is offered jointly by the University of Bern and Bern University of Applied Sciences (BFH).
