application_steps:
  - Browse available proposals. Use the category or publication year filters to narrow your search.
  - Open a proposal and read its aim, methods, workload and requirements. Check any start-date or workplace information.
  - Use the person listed under Contact to ask questions or apply. Follow that proposal's How to apply instructions and send the documents it requests. If no documents are specified, ask the project contact what to provide.
  - Discuss the project's current availability, scope and possible start date with the project contact.
administration_text: The proposal-return address below is for staff submitting project proposals. Student applications go to the individual project's contact, following its application instructions.
corrections_text: For corrections to this website or requests to remove information, contact the address below and include the relevant page link.
corrections_email: michael.single@unibe.ch
