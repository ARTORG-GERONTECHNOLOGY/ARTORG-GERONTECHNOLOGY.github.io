schema_version: 1
template_version: 1
statuses: [available, taken, archived]
status_transitions:
  available: [taken, archived]
  taken: [available, archived]
  archived: [available, taken]
eligibilities:
  bme_only: "Only BME students"
  bme_and_aim: "BME students and AIM students"
eligibility_filters:
  - id: bme
    label: BME students
    values: [bme_only, bme_and_aim]
  - id: aim
    label: AIM students
    values: [bme_and_aim]
required_text: [title, proposal_id, summary, language, student_eligibility, status, submission_email]
required_sections: [Background, Aim, Materials and Methods, Requirements]
optional_sections: [References]
immutable_fields: [proposal_id, created_at, date, permalink]
order:
  - {field: priority, direction: ascending}
  - {field: date, direction: descending}
  - {field: proposal_id, direction: ascending}
