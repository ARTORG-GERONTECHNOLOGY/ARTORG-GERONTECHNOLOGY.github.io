---
layout: default
---

<div class="container-fluid index">
  <div class="row index all-posts">

    <h1 class="header author-header">Search</h1>

    <div id="search-container">
      <label for="search-input">Search proposals</label>
      <p id="search-help">Enter a project title or topic.</p>
      <input type="search" id="search-input" placeholder="For example, gait analysis" aria-describedby="search-help">
      <noscript><p>Search requires JavaScript. You can also <a href="{{ '/posts/' | relative_url }}">browse all proposals</a>.</p></noscript>
      <div class="col-md-12 content-panel articles">
        <ul id="results-container" aria-live="polite"><li>Start typing to see results.</li></ul>
      </div>
    </div>

  </div>
</div>

<hr class="search-hr" />

<script src="{{ site.baseurl }}/js/jekyll-search.js" type="text/javascript"></script>

<script type="text/javascript">
  SimpleJekyllSearch.init({
    searchInput: document.getElementById('search-input'),
    resultsContainer: document.getElementById('results-container'),
    dataSource: '{{ site.baseurl }}/search.json',
    searchResultTemplate: '<li><a href="{url}" title="{desc}">{title}<\/a><\/li>',
    noResultsText: 'No results found',
    limit: 10,
    fuzzy: true,
  })
</script>
