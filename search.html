<div id="global-search" data-index="{{ '/search.json' | relative_url }}">
<form id="search-form" role="search">
<label for="search-input">Search projects, people, news and information</label>
<input id="search-input" name="q" type="search" aria-describedby="search-help" autocomplete="off">
<p id="search-help">Enter a title, name or topic. Results favour title matches.</p>
<label for="search-type">Content type</label>
<select id="search-type" name="type"><option value="all">All content</option><option value="proposal">Proposals</option><option value="team">People</option><option value="news">News</option><option value="page">Information</option></select>
<label class="search-availability"><input id="search-unavailable" type="checkbox"> Include taken and archived proposals</label>
<button type="submit">Search</button>
</form>
<noscript><p>Search requires JavaScript. <a href="{{ '/posts/' | relative_url }}">Browse proposals</a>, <a href="{{ '/team/' | relative_url }}">team profiles</a>, <a href="{{ '/news/' | relative_url }}">news</a> or <a href="{{ '/about/' | relative_url }}">About</a>.</p></noscript>
<p id="search-status" role="status" aria-live="polite">Enter a search term.</p>
<button id="search-retry" type="button" hidden>Retry loading search</button>
<ul id="search-results" aria-label="Search results"></ul>
<button id="search-more" type="button" hidden>More results</button>
</div>
<script src="{{ '/js/search-engine.js' | relative_url }}"></script>
<script src="{{ '/js/global-search.js' | relative_url }}"></script>
